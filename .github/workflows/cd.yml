name: Platform CD Deployment Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Build and Publish Production Container Images
  # ============================================================================
  build-and-publish:
    name: Build & Package Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-trust-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-trust-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Staging Deployment and End-to-End Smoke Gate
  # ============================================================================
  deploy-staging:
    name: Staging Deployment & Automated Smoke Gate
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.trust-platform.internal

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install requests

      - name: Apply Staging Database Migrations
        env:
          ENVIRONMENT: staging
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          python scripts/migrate.py --environment=staging

      - name: Execute Staging Smoke & Authorization Tests
        env:
          ENVIRONMENT: staging
          STAGING_URL: https://staging.trust-platform.internal
        run: |
          python tests/ci/test_staging_smoke.py

  # ============================================================================
  # 3. Production Deployment with Safe Rollback
  # ============================================================================
  deploy-production:
    name: Production Deployment (Manual Approval Required)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.trust-platform.com

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-Deployment Backup Snapshot
        run: |
          python scripts/backup_restore.py --action=backup --environment=production

      - name: Apply Production Database Migrations
        run: |
          python scripts/migrate.py --environment=production

      - name: Verify Production Health Probe
        run: |
          python scripts/smoke_test.py --environment=production --target-url=https://app.trust-platform.com
