name: Platform CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI: Linting, Unit & Integration Tests, Security Hardening
  # ============================================================================
  backend-ci:
    name: Backend Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov ruff

      - name: Backend Lint & Code Style Check
        run: |
          ruff check backend/app
          python -m py_compile backend/app/main.py

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          SUPABASE_JWT_SECRET: super-secret-jwt-key-minimum-32-characters-test
          SUPABASE_URL: https://mock.supabase.co
        run: |
          pytest tests/backend --cov=backend/app --cov-report=term-missing --cov-fail-under=80

  # ============================================================================
  # 2. Frontend CI: Flutter Analyze & Widget Tests
  # ============================================================================
  frontend-ci:
    name: Frontend Quality & Widget Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Static Analysis
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Run Frontend Widget Tests
        working-directory: frontend
        run: flutter test --coverage

  # ============================================================================
  # 3. Database Migration Sequence Verification
  # ============================================================================
  database-migrations:
    name: Database Migration Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Database Migrations
        run: |
          python scripts/migrate.py --verify-only

  # ============================================================================
  # 4. Container & Docker Compose Validation
  # ============================================================================
  container-validation:
    name: Container Build & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
