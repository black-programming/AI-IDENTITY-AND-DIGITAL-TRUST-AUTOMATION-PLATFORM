[project]
name = "ai-identity-trust-backend"
version = "0.1.0"
description = "FastAPI backend for AI Identity & Digital Trust Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
