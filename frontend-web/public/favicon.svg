<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <polygon points="50,6 90,26 90,66 50,94 10,66 10,26" stroke="url(#cyberGlow)" stroke-width="3" fill="#0A0F1D" fill-opacity="0.85" filter="url(#neonBlur)"/>
  <circle cx="50" cy="50" r="16" stroke="#00F0FF" stroke-width="2.5" fill="#111B33" />
  <circle cx="50" cy="50" r="7" fill="#00F0FF" />
  <line x1="50" y1="20" x2="50" y2="34" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="66" x2="50" y2="80" stroke="#7000FF" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="35" x2="36" y2="42" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="35" x2="64" y2="42" stroke="#7000FF" stroke-width="2" stroke-linecap="round" />
</svg>