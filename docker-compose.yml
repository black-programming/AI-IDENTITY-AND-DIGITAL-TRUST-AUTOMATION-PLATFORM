# ==============================================================================
# AI Identity & Digital Trust Automation Platform — Docker Compose Stack
# Orchestrates: Backend (FastAPI), Frontend (Flutter Web / Nginx), Gateway (Proxy)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-trust-platform-backend:1.0.0
    container_name: ai-trust-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=staging
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-trust-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-trust-platform-frontend:1.0.0
    container_name: ai-trust-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-trust-net

  gateway:
    image: nginx:1.27-alpine
    container_name: ai-trust-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - ai-trust-net

networks:
  ai-trust-net:
    driver: bridge
